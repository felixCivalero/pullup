<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover"
    />

    <!-- Primary Meta -->
    <title>PullUp — The Production Core</title>
    <meta name="title" content="PullUp — The Production Core" />
    <meta name="description" content="Stop inventing marketing content. We turn your daily operations and founder vision into a high-retention, global content engine — run on 30-minute BKM sprints." />
    <link rel="canonical" href="https://pullup.se/" />

    <!-- Open Graph. Absolute URLs so strict crawlers (Instagram via Facebook)
         don't drop the preview. Bump the image ?v= whenever the card art
         changes to bust Facebook's ~24h cache. og-agency.jpg is the homepage
         card; og-image.jpg stays as the imageless-event fallback. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pullup.se/" />
    <meta property="og:site_name" content="PullUp" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Restructure your organization for 2027 and onwards." />
    <meta property="og:description" content="Stop inventing marketing content. We turn your daily operations and founder vision into a high-retention, global content engine — run on 30-minute BKM sprints." />
    <meta property="og:image" content="https://pullup.se/og-agency.jpg?v=1" />
    <meta property="og:image:secure_url" content="https://pullup.se/og-agency.jpg?v=1" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PullUp — The Production Core. Restructure your organization for 2027 and onwards." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Restructure your organization for 2027 and onwards." />
    <meta name="twitter:description" content="Stop inventing marketing content. We turn your daily operations and founder vision into a high-retention, global content engine — run on 30-minute BKM sprints." />
    <meta name="twitter:image" content="https://pullup.se/og-agency.jpg?v=1" />
    <meta name="twitter:image:alt" content="PullUp — The Production Core. Restructure your organization for 2027 and onwards." />

    <!-- Structured data: who we are and what we sell -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "PullUp",
        "alternateName": "PullUp — The Production Core",
        "url": "https://pullup.se/",
        "logo": "https://pullup.se/pwa-icon-512.png",
        "image": "https://pullup.se/og-agency.jpg?v=1",
        "description": "Stop inventing marketing content. We turn your daily operations and founder vision into a high-retention, global content engine — run on 30-minute BKM sprints.",
        "email": "hello@pullup.se",
        "areaServed": "Worldwide",
        "makesOffer": [
          {
            "@type": "Offer",
            "name": "The Retained Architecture",
            "description": "We run the engine with you: dual tracks moderated, assets scripted line by line. Every engagement starts with a 3-month trust period with no commitment; after that, longer commitments lower the monthly rate.",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "price": "3000",
              "priceCurrency": "USD",
              "unitCode": "MON"
            }
          }
        ]
      }
    </script>

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- PWA / installed-app behaviour. iOS ignores the manifest's display mode,
         so these tell Safari to launch chrome-free from the home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PullUp" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
