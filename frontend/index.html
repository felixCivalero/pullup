<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover"
    />

    <!-- Primary Meta -->
    <title>PullUp — Alla tittar på klippet. Vi tittar på människorna bakom det.</title>
    <meta name="title" content="PullUp — Alla tittar på klippet. Vi tittar på människorna bakom det." />
    <meta name="description" content="Alla tittar på klippet. Vi tittar på människorna bakom det – strategi, innehåll och tillväxt för grundare, artister och mindre varumärken. Ett erbjudande: 30 000 kr i månaden." />
    <link rel="canonical" href="https://pullup.se/" />

    <!-- Open Graph. Absolute URLs so strict crawlers (Instagram via Facebook)
         don't drop the preview. Bump the image ?v= whenever the card art
         changes to bust Facebook's ~24h cache. og-agency.jpg is the homepage
         card; og-image.jpg stays as the imageless-event fallback. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pullup.se/" />
    <meta property="og:site_name" content="PullUp" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Alla tittar på klippet. Vi tittar på människorna bakom det." />
    <meta property="og:description" content="Alla tittar på klippet. Vi tittar på människorna bakom det – strategi, innehåll och tillväxt för grundare, artister och mindre varumärken. Ett erbjudande: 30 000 kr i månaden." />
    <meta property="og:image" content="https://pullup.se/og-agency.jpg?v=4" />
    <meta property="og:image:secure_url" content="https://pullup.se/og-agency.jpg?v=4" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PullUp — Alla tittar på klippet. Vi tittar på människorna bakom det. För grundare, artister och mindre varumärken, Stockholm och Nairobi." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alla tittar på klippet. Vi tittar på människorna bakom det." />
    <meta name="twitter:description" content="Alla tittar på klippet. Vi tittar på människorna bakom det – strategi, innehåll och tillväxt för grundare, artister och mindre varumärken. Ett erbjudande: 30 000 kr i månaden." />
    <meta name="twitter:image" content="https://pullup.se/og-agency.jpg?v=4" />
    <meta name="twitter:image:alt" content="PullUp — Alla tittar på klippet. Vi tittar på människorna bakom det. För grundare, artister och mindre varumärken, Stockholm och Nairobi." />

    <!-- Structured data: who we are and what we sell -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "PullUp",
        "alternateName": "PullUp — Alla tittar på klippet. Vi tittar på människorna bakom det.",
        "url": "https://pullup.se/",
        "logo": "https://pullup.se/pwa-icon-512.png",
        "image": "https://pullup.se/og-agency.jpg?v=4",
        "description": "Alla tittar på klippet. Vi tittar på människorna bakom det – strategi, innehåll och tillväxt för grundare, artister och mindre varumärken. Ett erbjudande: 30 000 kr i månaden.",
        "email": "hello@pullup.se",
        "areaServed": ["Stockholm", "Nairobi", "Worldwide"],
        "inLanguage": ["sv", "en"],
        "makesOffer": [
          {
            "@type": "Offer",
            "name": "Ett erbjudande",
            "description": "Strategi, en 30-minuterssprint varje vecka och alla verktyg bakom den. Första månaden har pengarna-tillbaka-garanti; därefter binder du dig för att fortsätta – ju längre, desto lägre månadspris.",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "price": "30000",
              "priceCurrency": "SEK",
              "unitCode": "MON"
            }
          }
        ]
      }
    </script>

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- PWA / installed-app behaviour. iOS ignores the manifest's display mode,
         so these tell Safari to launch chrome-free from the home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PullUp" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
