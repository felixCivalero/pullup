<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />

    <!-- Primary Meta -->
    <title>Creative powerhouse — PullUp</title>
    <meta name="title" content="Creative powerhouse — PullUp" />
    <meta name="description" content="PullUp är en creative powerhouse i Stockholm. Vi bygger världar runt kärnan i ert varumärke – content, tillväxt och upplevelser. Online, i AI-svaren och på riktigt." />
    <link rel="canonical" href="https://pullup.se/" />

    <!-- Open Graph. Absolute URLs so strict crawlers (Instagram via Facebook)
         don't drop the preview. Bump the image ?v= whenever the card art
         changes to bust Facebook's ~24h cache. og/home.jpg is the front page's
         card (scripts/og-pages.mjs draws it and the other pages' cards). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pullup.se/" />
    <meta property="og:site_name" content="PullUp" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Creative powerhouse — PullUp" />
    <meta property="og:description" content="PullUp är en creative powerhouse i Stockholm. Vi bygger världar runt kärnan i ert varumärke – content, tillväxt och upplevelser. Online, i AI-svaren och på riktigt." />
    <meta property="og:image" content="https://pullup.se/og/home.jpg?v=1" />
    <meta property="og:image:secure_url" content="https://pullup.se/og/home.jpg?v=1" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Creative powerhouse — PullUp, Stockholm" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Creative powerhouse — PullUp" />
    <meta name="twitter:description" content="PullUp är en creative powerhouse i Stockholm. Vi bygger världar runt kärnan i ert varumärke – content, tillväxt och upplevelser. Online, i AI-svaren och på riktigt." />
    <meta name="twitter:image" content="https://pullup.se/og/home.jpg?v=1" />
    <meta name="twitter:image:alt" content="Creative powerhouse — PullUp, Stockholm" />

    <!-- Structured data: who we are and what we sell -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "PullUp",
        "url": "https://pullup.se/",
        "logo": "https://pullup.se/pwa-icon-512.png",
        "image": "https://pullup.se/og/home.jpg?v=1",
        "description": "PullUp är en creative powerhouse i Stockholm. Vi bygger världar runt kärnan i ert varumärke – content, tillväxt och upplevelser. Online, i AI-svaren och på riktigt.",
        "email": "felix@pullup.se",
        "areaServed": ["Stockholm"],
        "inLanguage": ["sv", "en"]
      }
    </script>

    <!-- The event platform, so search and AI answers know pullup.se is also
         a free event tool (its own page: /pullup, built from productMeta.js). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PullUp",
        "url": "https://pullup.se/pullup",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Gratis eventsida med anmälan, bekräftelsemejl med kalenderinbjudan, väntelista, gästlista och CRM. Din AI-assistent kan sköta det via MCP (https://mcp.pullup.se).",
        "offers": { "@type": "Offer", "price": 0, "priceCurrency": "SEK" }
      }
    </script>

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Tag stubs: the site is wired for Google, Meta and TikTok tags, but no
         loader and no id is in yet (Felix 2026-11-02: not needed now). These
         only queue calls in memory: nothing loads, no cookie, nothing leaves
         the browser. To go live, add each tool's loader with its id, behind
         the cookie consent. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function gtag() { window.dataLayer.push(arguments); };
      window.fbq = window.fbq || function fbq() { (window.fbq.queue = window.fbq.queue || []).push(arguments); };
      window.ttq = window.ttq || []; window.ttq.methods = ["page", "track", "identify"];
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
