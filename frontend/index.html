<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover"
    />

    <!-- Primary Meta -->
    <title>PullUp — Starka människor bygger starka varumärken</title>
    <meta name="title" content="PullUp — Starka människor bygger starka varumärken" />
    <meta name="description" content="Starka människor bygger starka varumärken. Vi gör dem starkare – strategi, innehåll och tillväxt för grundare, artister och mindre varumärken. Ett erbjudande, med siffrorna som visar det." />
    <link rel="canonical" href="https://pullup.se/" />

    <!-- Open Graph. Absolute URLs so strict crawlers (Instagram via Facebook)
         don't drop the preview. Bump the image ?v= whenever the card art
         changes to bust Facebook's ~24h cache. og-agency.jpg is the homepage
         card; og-image.jpg stays as the imageless-event fallback. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pullup.se/" />
    <meta property="og:site_name" content="PullUp" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Starka människor bygger starka varumärken. Vi gör dem starkare." />
    <meta property="og:description" content="Starka människor bygger starka varumärken. Vi gör dem starkare – strategi, innehåll och tillväxt för grundare, artister och mindre varumärken. Ett erbjudande, med siffrorna som visar det." />
    <meta property="og:image" content="https://pullup.se/og-agency.jpg?v=3" />
    <meta property="og:image:secure_url" content="https://pullup.se/og-agency.jpg?v=3" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PullUp — Starka människor bygger starka varumärken. För grundare, artister och mindre varumärken, Stockholm och Nairobi." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Starka människor bygger starka varumärken. Vi gör dem starkare." />
    <meta name="twitter:description" content="Starka människor bygger starka varumärken. Vi gör dem starkare – strategi, innehåll och tillväxt för grundare, artister och mindre varumärken. Ett erbjudande, med siffrorna som visar det." />
    <meta name="twitter:image" content="https://pullup.se/og-agency.jpg?v=3" />
    <meta name="twitter:image:alt" content="PullUp — Starka människor bygger starka varumärken. För grundare, artister och mindre varumärken, Stockholm och Nairobi." />

    <!-- Structured data: who we are and what we sell -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "PullUp",
        "alternateName": "PullUp — Great people make great brands",
        "url": "https://pullup.se/",
        "logo": "https://pullup.se/pwa-icon-512.png",
        "image": "https://pullup.se/og-agency.jpg?v=3",
        "description": "Great people make great brands. We make them greater — strategy, content and growth for founders, artists and small brands — one offer, with the numbers to show it.",
        "email": "hello@pullup.se",
        "areaServed": ["Stockholm", "Nairobi", "Worldwide"],
        "makesOffer": [
          {
            "@type": "Offer",
            "name": "The Retained Architecture",
            "description": "30-minute sprints with you or your team, turned into short-form video, posts and copy in your voice — measured and repeated. Every engagement starts with a money-back first month; after that, commit to continue — longer commitments lower the monthly rate.",
            "priceSpecification": {
              "@type": "UnitPriceSpecification",
              "price": "30000",
              "priceCurrency": "SEK",
              "unitCode": "MON"
            }
          }
        ]
      }
    </script>

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- PWA / installed-app behaviour. iOS ignores the manifest's display mode,
         so these tell Safari to launch chrome-free from the home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PullUp" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
